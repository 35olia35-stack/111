<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Success</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f6f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #111827;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
      max-width: 420px;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Payment successful</h1>
    <p>You can now return to the extension.</p>
    <button onclick="window.close()">Close</button>
  </div>
<script>
  const params = new URLSearchParams(window.location.search);

  if (params.get("paid") === "1") {
    chrome.runtime.sendMessage(
      "ТВОЙ_EXTENSION_ID",
      { type: "PAYMENT_SUCCESS" },
      function(response) {
        console.log("Payment signal sent:", response);
      }
    );
  }
</script>

</body>
</html>
